name: metrics

# Daily adoption snapshot. Commits a dated JSON file so the numbers accumulate
# into a time series in the repo rather than living only in a dashboard.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Collect metrics
        env:
          # Needed for the traffic endpoints (clones, views); the rest work unauthenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run metrics -- --write
      - name: Commit snapshot if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git diff --staged --quiet || git commit -m "metrics: daily snapshot"
          git push
